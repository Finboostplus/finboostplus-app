# ==============================================
# PROFILE: prod (Configuracoes gerais de producao)
# ==============================================
# Ativar com: --spring.profiles.active=prod (ou incluir outros: prod,prod-neon)
# Objetivo: Valores padrao seguros + tudo via variaveis de ambiente.

# DataSource (todos override via env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP (ajuste via env conforme carga)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Observabilidade / Actuator (expor endpoints especificos)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging (reduzir verbosidade)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.finboostplus=${LOG_APP_LEVEL:INFO}

# Seguranca - exigir origem configurada
cors.origins=${CORS_ORIGINS:https://app.finboostplus.com}

# Swagger / Docs normalmente desabilitados em prod (pode habilitar condicionalmente)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}

# Tokens (ajuste por ambiente)
security.jwt.duration=${JWT_DURATION:864000}
security.refresh-token.duration=${REFRESH_TOKEN_DURATION:30}

