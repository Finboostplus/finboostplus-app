# ==============================================
# PROFILE: prod (Configuracoes gerais de producao)
# ==============================================
# Ativar com: --spring.profiles.active=prod
# Objetivo: Valores padrao seguros + tudo via variaveis de ambiente.

# DataSource (usar SPRING_* ou fallback para SPRING_DATABASE_*)
# Observacao: use URL JDBC do PostgreSQL (ex.: jdbc:postgresql://host:5432/db?sslmode=require)
spring.datasource.url=${SPRING_DATASOURCE_URL:${SPRING_DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SPRING_DATABASE_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SPRING_DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP (ajuste via env conforme carga)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Reforco de SSL para Neon (opcional, alem do sslmode na URL)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# Observabilidade / Actuator (expor endpoints especificos)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.metrics.export.prometheus.enabled=true

# Health check personalizado
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Logging (reduzir verbosidade)
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.finboostplus=${LOG_APP_LEVEL:INFO}

# Seguranca - exigir origem configurada
cors.origins=${CORS_ORIGINS:https://app.finboostplus.com}

# Swagger / Docs normalmente desabilitados em prod (pode habilitar condicionalmente)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}

# Tokens (ajuste por ambiente)
security.jwt.duration=${JWT_DURATION:864000}
security.refresh-token.duration=${REFRESH_TOKEN_DURATION:30}

# ==============================
# SSL (opcional - se terminando TLS no app)
# server.port=8443
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=finboost
# ==============================

# ==============================================
# NOTA SOBRE NEON
# ==============================================
# Para Neon, garanta que a URL contenha sslmode=require. Exemplo JDBC:
# SPRING_DATASOURCE_URL=jdbc:postgresql://<endpoint-neon>/<database>?sslmode=require
# Caso prefira, defina NEON_DATABASE_URL com o mesmo formato JDBC.
