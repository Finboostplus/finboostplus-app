# ===============================
# APP BASE (configuracoes comuns)
# ===============================
spring.application.name=finboostplus

# Perfis: usar --spring.profiles.active=dev | test | prod
# Este arquivo contem apenas configuracoes compartilhadas.

# Seguranca / JWT
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:CHANGE_ME_STRONG_CLIENT_SECRET}
security.jwt.duration=${JWT_DURATION:864000}
security.refresh-token.duration=${REFRESH_TOKEN_DURATION:30}

# CORS (ajuste conforme necessario por ambiente via variavel de ambiente)
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# SpringDoc / Swagger / Scalar
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.show-actuator=false
springdoc.group-configs[0].group=public
springdoc.group-configs[0].paths-to-match=/**

# Metadados da documentacao
app.docs.title=FinBoost Plus API Documentation
app.docs.description=Documentacao interativa da API usando Scalar
app.docs.version=1.0.0

# JPA comum (dialect definido por perfil se necessario)
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# Logging basico
logging.level.org.springframework.security=${LOG_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_SQL:OFF}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL_PARAMS:OFF}

# ===============================
# Placeholders (datasource definidos nos perfis)
# ===============================
# spring.datasource.* definidos em application-<profile>.properties

# Perfis de producao poderao usar somente 'prod' com variaveis de ambiente ou perfis especializados futuros (ex: prod-neon, prod-oracle)