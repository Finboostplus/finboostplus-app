# ===============================
# PROFILE: test (H2 in-memory)
# ===============================

spring.datasource.url=jdbc:h2:mem:finboost_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Cria e destroi schema a cada execucao de testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar SQL em testes apenas se necessario
spring.jpa.show-sql=${SHOW_SQL:false}

# Desabilitar flyway (caso venha a ser adicionado futuramente) para evitar conflitos em create-drop
spring.flyway.enabled=false

# Logs mais limpos em testes
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=OFF

# CORS restrito
cors.origins=http://localhost:3000,http://localhost:5173