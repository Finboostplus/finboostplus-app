# ==============================================
# PROFILE: dev (PostgreSQL local ou Docker)
# ==============================================
# Uso: spring.profiles.active=dev
# Pode usar Postgres local (localhost) ou container docker-compose (servico 'db').
# Override via variaveis de ambiente SPRING_DATASOURCE_* ou DATABASE_*.

# URL padrao: tenta localhost se nao definido. Ajuste porta se mudou no docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finboostplus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# DDL: update em dev (mantem dados entre reinicios). Para limpar: trocar para create-drop temporariamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool Hikari (valores moderados p/ dev)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Mostrar SQL se necessario: export SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}

# Migracoes (caso Flyway seja adicionado futuramente)
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Logging mais detalhado util em dev
logging.level.org.springframework.web=${LOG_WEB:INFO}
logging.level.com.finboostplus=${LOG_APP:DEBUG}

# CORS adicional (pode sobrescrever no container via CORS_ORIGINS)
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}