# Perfil de testes - usar H2 em memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Desabilitar possiveis integracoes externas em testes
spring.sql.init.mode=never

# Ajustes de logging para reduzir ruido
logging.level.org.springframework.security=INFO

# Config de seguranca padrao para testes
security.client-id=test-client
security.client-secret=test-secret
security.jwt.duration=3600
security.refresh-token.duration=7
cors.origins=http://localhost:3000,http://localhost:5173

